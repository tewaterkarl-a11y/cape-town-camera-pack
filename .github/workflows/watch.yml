name: Watch cameras between monitor runs

# GitHub does not keep to the monitor's hourly schedule. From 12 to 15
# October it started the monitor every 3 to 8 hours, never hourly. On
# 2026-10-15 the 07:34 UTC run found Table Mountain & Lion's Head live, the
# stream ended soon after, and with no run for hours the site played the
# ended stream's recording all morning.
#
# This job does not rely on the schedule's timing. Whenever GitHub starts it,
# it stays up for close to the 6-hour job limit and runs the same health
# check every 10 minutes from a fresh copy of main. When the check finds a
# problem it starts the monitor, which repairs and alerts exactly as before.
# A run that starts while one is still going waits for it, so they hand over
# with little or no gap.
#
# Cost: one YouTube Data API unit per check (about 150 a day of the 10,000
# daily quota). The monitor's repair costs about 105 units per dead camera. It
# is started every 30 minutes for the first 2 hours of a problem, then hourly:
# a camera that is gone for good costs about 3,400 units a day, so two at once
# still fit in the quota (pure 30-minute retries would not). Actions minutes
# are free for public repositories.
#
# A green run is not proof that cameras were checked. From 15 October to
# 6 November every check failed with "Permission denied" and the runs stayed
# green, so Table Mountain & Lion's Head showed an ended stream for 8 hours on
# the night of 5 to 6 November. Now a check that cannot run fails the run at
# once, three skipped checks in a row (YouTube API down, quota spent, key
# missing) fail it after 20 minutes, and the monitor raises an alert when the
# watcher has failed or stopped running.

on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write # to start the monitor

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      YT_API_KEY: ${{ secrets.YT_API_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Check every 10 minutes and start the monitor on a problem
        run: |
          set -u
          stop_at=$((SECONDS + 345 * 60))
          # While a camera stays down, restart the monitor every 30 minutes
          # for the first 2 hours, then hourly. Between the Table Mountain
          # operator's streams the next one is often scheduled but not live
          # yet, so the first repair finds nothing; the retry interval is how
          # long visitors see the recording once the new stream starts. The
          # hourly back-off keeps a camera that is gone for good within quota.
          last_start=-3600
          problem_since=-1
          skipped=0
          while [ "$SECONDS" -lt "$stop_at" ]; do
            # A repair commits to main, so check the camera list as it is now.
            if git fetch -q --depth 1 origin main; then
              git reset -q --hard FETCH_HEAD
            fi
            # Run through bash: check.sh is not executable in git, and the
            # reset above undoes any chmod. On 15 October that made every
            # check fail with "Permission denied" for six hours while the
            # run stayed green. check.sh always exits 0 when it runs, so a
            # failure here means no check happened: fail the run loudly.
            rm -f status.txt
            if ! REPORT_FILE=report.txt STATUS_FILE=status.txt bash scripts/check.sh; then
              echo "::error::scripts/check.sh could not run, so cameras are not being checked."
              exit 1
            fi
            status=$(cat status.txt 2>/dev/null || echo "not checked: check.sh wrote no status")
            if [ "$status" = "checked" ]; then
              skipped=0
            else
              # An empty report from a skipped check is not "all clear".
              skipped=$((skipped + 1))
              echo "$(date -u '+%H:%M') cameras ${status} (${skipped} in a row)"
              if [ "$skipped" -ge 3 ]; then
                echo "::error::Cameras have not been checked for 20 minutes: ${status}"
                exit 1
              fi
            fi
            if [ ! -s report.txt ]; then
              if [ "$status" = "checked" ]; then
                echo "$(date -u '+%H:%M') all clear"
                problem_since=-1
              fi
            else
              echo "$(date -u '+%H:%M') problem found:"; cat report.txt
              if [ "$problem_since" -lt 0 ]; then problem_since=$SECONDS; fi
              if [ $((SECONDS - problem_since)) -lt 7200 ]; then retry=1800; else retry=3600; fi
              if [ $((SECONDS - last_start)) -ge "$retry" ]; then
                if gh workflow run monitor.yml --repo "$GITHUB_REPOSITORY" --ref main; then
                  last_start=$SECONDS
                  echo "Started the monitor to repair and alert."
                fi
              else
                echo "Monitor started $(( (SECONDS - last_start) / 60 )) minutes ago; next start after $((retry / 60))."
              fi
            fi
            sleep 600
          done
