name: Test scripts

# Runs the auto-repoint and health-check tests (with the network faked) whenever a PR
# changes the scripts or workflows, so a change to the repair logic is proved
# before it can touch cameras.json. Read-only, no secrets.

on:
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Auto-repoint decisions
        run: bash scripts/test-auto-repoint.sh
      - name: Health check reports whether cameras were checked
        run: bash scripts/test-check.sh
