name: Re-check disabled cameras

# The main monitor only tests enabled cameras, so a disabled one is never
# looked at again. This job closes that blind spot: once a week it asks whether
# any camera we gave up on has become usable, and says something only when the
# answer is yes.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, early UTC (GitHub cron is best-effort)
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

concurrency:
  group: recheck-disabled
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: "Disabled camera is restorable"
    steps:
      - uses: actions/checkout@v4

      - name: Re-check disabled cameras
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          chmod +x scripts/recheck-disabled.sh
          REPORT_FILE=restorable.txt scripts/recheck-disabled.sh

      - name: Open or close the restorable-camera issue
        run: |
          set -u
          # Same lookup approach as the main monitor: list rather than search,
          # because the search backend 504s often enough to fail a healthy run.
          find_issue() {
            gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
              --json number,title \
              --jq 'first(.[] | select(.title == env.ISSUE_TITLE) | .number) // empty'
          }

          if ! existing=$(find_issue); then
            sleep 10
            if ! existing=$(find_issue); then
              echo "Could not reach the GitHub issues API; skipping issue update this run." >&2
              exit 0
            fi
          fi

          if [ -s restorable.txt ]; then
            {
              echo "@tewaterkarl-a11y — a camera that is switched off in \`cameras.json\` looks usable again, as of $(date -u '+%Y-%m-%d %H:%M UTC'):"
              echo
              sed 's/^/- /' restorable.txt
              echo
              echo "Each one above is **live and embeddable**, so it should play on the site."
              echo "To restore it, set \`\"enabled\": true\` on that camera in \`cameras.json\`."
              echo "Visitors pick the change up on next load, no redeploy."
              echo
              echo "Worth confirming in a real iframe before restoring: load the video through"
              echo "the IFrame Player API and check it reaches PLAYING rather than error 150."
              echo
              echo "_This issue auto-closes once none of the disabled cameras are restorable._"
            } > recheck-body.md

            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file recheck-body.md
              echo "Updated existing restorable issue #$existing"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file recheck-body.md
              echo "Opened new restorable issue"
            fi
          else
            if [ -n "$existing" ]; then
              gh issue close "$existing" --repo "$GITHUB_REPOSITORY" \
                --comment "No disabled camera is currently restorable, as of $(date -u '+%Y-%m-%d %H:%M UTC'). Auto-closing."
              echo "Closed stale restorable issue #$existing"
            else
              echo "Nothing restorable; nothing to do."
            fi
          fi
