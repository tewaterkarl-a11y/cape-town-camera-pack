name: Monitor site and cameras

# Three jobs, in order:
#   check   - looks for a dead camera.
#   repoint - only if one is dead: runs auto-repoint now, so a same-title
#             restart is fixed before anyone is told about it.
#   alert   - checks again from a fresh copy of main and opens, updates or
#             closes the alert issue. A camera that auto-repoint fixed is
#             therefore never reported (owner decision, 2026-10-04); one it
#             could not fix still is.
# Auto-repoint never starts this workflow when the monitor called it, so the
# two cannot loop.

on:
  schedule:
    # Asks for hourly, but GitHub has started it only every 3 to 8 hours
    # (12 to 15 October 2026). watch.yml checks every 10 minutes and starts
    # this workflow when it finds a problem, so repairs no longer wait on
    # this schedule.
    - cron: "23 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      camera_problem: ${{ steps.camera.outputs.camera_problem }}
    steps:
      - uses: actions/checkout@v5

      - name: Run health checks
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          chmod +x scripts/check.sh
          REPORT_FILE=report.txt scripts/check.sh

      - name: Note whether a camera is down
        id: camera
        run: |
          if grep -q '^CAMERA ' report.txt; then
            echo "camera_problem=true" >> "$GITHUB_OUTPUT"
          else
            echo "camera_problem=false" >> "$GITHUB_OUTPUT"
          fi

  # Waiting for auto-repoint's own schedule (twice daily, often hours late)
  # left a dead camera down for up to ~17 hours, so run it now instead.
  repoint:
    needs: check
    if: needs.check.outputs.camera_problem == 'true'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/auto-repoint.yml
    with:
      from_monitor: true
    secrets: inherit

  alert:
    needs: [check, repoint]
    # Runs whether or not the repair ran or succeeded: a failed repair must
    # still raise the alert.
    if: ${{ always() && needs.check.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
      actions: read # to see whether the watcher is running
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: "Monitor alert: site or camera problem detected"
    steps:
      # Check out main as it is now, so it sees a repair committed moments ago
      # by the repoint job. Without `ref`, checkout uses the commit the run
      # started on, and the alert reported "still dead" seconds after every
      # successful repair (2026-10-06 to 10-09).
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Run health checks
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          chmod +x scripts/check.sh
          REPORT_FILE=report.txt scripts/check.sh

      # The watcher is what catches an ended stream within 10 minutes. From
      # 15 October to 6 November it ran without checking anything and nobody
      # knew, so Table Mountain & Lion's Head showed an ended stream for 8
      # hours on 5 to 6 November. It now fails its run when it cannot check;
      # this turns a failed or missing watcher into an alert. Cancelled runs
      # are ignored: they are hourly starts that queued behind a running one.
      # GitHub has left gaps of over 2 hours between runs, hence 3 hours.
      - name: Check the watcher is running
        run: |
          set -u
          if ! runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow watch.yml --limit 20 \
                --json status,conclusion,updatedAt); then
            echo "::warning::Could not list the watcher's runs; skipping the watcher check this time."
            exit 0
          fi
          line=$(echo "$runs" | jq -r --argjson now "$(date -u +%s)" '
            if any(.[]; .status == "in_progress") then empty
            else (map(select(.status == "completed" and .conclusion != "cancelled" and .conclusion != "skipped")) | first) as $last
              | if $last == null or ($now - ($last.updatedAt | fromdateiso8601)) > 10800 then
                  "WATCHER NOT RUNNING: \"Watch cameras between monitor runs\" has not run for 3 hours, so an ended stream can play for hours. Start it from the Actions tab."
                elif $last.conclusion != "success" then
                  "WATCHER FAILED: the latest \"Watch cameras between monitor runs\" run failed, so cameras are not being checked every 10 minutes. Open that run in the Actions tab for the error."
                else empty end
            end')
          if [ -n "$line" ]; then
            echo "$line" | tee -a report.txt
          else
            echo "Watcher is running or finished cleanly within 3 hours."
          fi

      - name: Open, update, or close the alert issue
        run: |
          set -u
          # Find the open alert issue by exact title. Deliberately avoids
          # --search: the search backend 504s often enough to fail an otherwise
          # healthy run. One retry, then give up quietly — a transient GitHub
          # outage should not look like a dead camera.
          find_issue() {
            gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
              --json number,title \
              --jq 'first(.[] | select(.title == env.ISSUE_TITLE) | .number) // empty'
          }

          if ! existing=$(find_issue); then
            sleep 10
            if ! existing=$(find_issue); then
              echo "Could not reach the GitHub issues API; skipping issue update this run." >&2
              exit 0
            fi
          fi

          if [ -s report.txt ]; then
            {
              echo "@tewaterkarl-a11y — the monitor found problems on $(date -u '+%Y-%m-%d %H:%M UTC'):"
              echo
              sed 's/^/- /' report.txt
              echo
              echo "**How to fix a dead camera:** find the stream's new live video ID on YouTube,"
              echo "then update its \`streamUrl\` in \`cameras.json\` in this repo (or set"
              echo "\`\"enabled\": false\`). Visitors pick up the change on next load — no redeploy."
              echo
              echo "_This issue auto-closes once all checks pass again._"
            } > body.md

            if [ -n "$existing" ]; then
              # Hourly checks would otherwise email the same problem every
              # hour. Comment only when the list of problems has changed
              # since the issue's latest post.
              last=$(gh issue view "$existing" --repo "$GITHUB_REPOSITORY" --json body,comments \
                --jq 'if (.comments | length) > 0 then .comments[-1].body else .body end' | grep '^- ' | sort)
              now=$(sed 's/^/- /' report.txt | sort)
              if [ "$last" = "$now" ]; then
                echo "Alert issue #$existing already lists these problems; not commenting again."
              else
                gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file body.md
                echo "Updated existing alert issue #$existing"
              fi
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file body.md
              echo "Opened new alert issue"
            fi
          else
            if [ -n "$existing" ]; then
              gh issue close "$existing" --repo "$GITHUB_REPOSITORY" \
                --comment "All checks passing again as of $(date -u '+%Y-%m-%d %H:%M UTC'). Auto-closing."
              echo "Closed recovered alert issue #$existing"
            else
              echo "All healthy; nothing to do."
            fi
          fi
